<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Migration Firebase Halawa</title>
  <style>
    body { font-family: monospace; padding: 40px; background: #111; color: #eee; }
    h1 { color: #fff; }
    textarea { width: 100%; height: 150px; background: #222; color: #fff; border: 1px solid #555; padding: 10px; font-family: monospace; }
    button { padding: 12px 24px; background: #D6472F; color: #fff; border: none; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 16px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #log { margin-top: 30px; background: #000; padding: 20px; border-radius: 4px; border: 1px solid #333; height: 300px; overflow-y: auto; }
    .success { color: #4CAF50; }
    .error { color: #F44336; }
    .info { color: #2196F3; }
  </style>
</head>
<body>
  <h1>Outil de Migration Firebase (Tâche 3)</h1>
  <p>1. Copie-colle ton objet <b>firebaseConfig</b> ci-dessous (juste l'intérieur des accolades <code>{ ... }</code>) :</p>
  <textarea id="configInput" placeholder='{
  "apiKey": "...",
  "authDomain": "...",
  "projectId": "...",
  "storageBucket": "...",
  "messagingSenderId": "...",
  "appId": "..."
}'></textarea>
  <br>
  <button id="startBtn">Démarrer la Migration</button>

  <div id="log">En attente...</div>

  <!-- Firebase v9 SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

  <script>
    // Liste des produits actuels
    const products = [
      {id:0, name:"Orange NY", price:199, img:"assets/images/Orange.png", desc:"Casquette 47 New York Yankees, couleur orange avec logo NY blanc brodé. Coupe ajustée, visière incurvée."},
      {id:1, name:"Bordeaux LA", price:199, img:"assets/images/Bordeaux LA.png", desc:"Casquette 47 LA (Los Angeles), couleur bordeaux avec logo LA blanc brodé. Coupe ajustée, visière incurvée."},
      {id:2, name:"Camel NY", price:199, img:"assets/images/Camel.png", desc:"Casquette 47 New York Yankees, couleur camel avec logo NY ton sur ton. Coupe ajustée, visière incurvée."},
      {id:3, name:"Vert Pétant NY", price:199, img:"assets/images/Vert Petant.png", desc:"Casquette 47 New York Yankees, couleur vert pétant avec logo NY noir brodé. Coupe ajustée, visière incurvée."},
      {id:4, name:"Rose NY", price:199, img:"assets/images/Rose.png", desc:"Casquette 47 New York Yankees, couleur rose avec logo NY blanc brodé. Coupe ajustée, visière incurvée."},
      {id:5, name:"Violet NY", price:199, img:"assets/images/Violet.png", desc:"Casquette 47 New York Yankees, couleur violet avec logo NY blanc brodé. Coupe ajustée, visière incurvée."},
      {id:6, name:"Bleu Marine NY", price:199, img:"assets/images/Bleu marine.png", desc:"Casquette 47 New York Yankees, couleur bleu marine avec logo NY blanc brodé. Coupe ajustée, visière incurvée."},
      {id:7, name:"Bleu Ciel NY", price:199, img:"assets/images/Bleu ciel.png", desc:"Casquette 47 New York Yankees, couleur bleu ciel avec logo NY blanc brodé. Coupe ajustée, visière incurvée."},
      {id:8, name:"Vert Foncé NY (Logo Noir)", price:199, img:"assets/images/Vert Foncé NY.png", desc:"Casquette 47 New York Yankees, couleur vert foncé avec logo NY noir brodé. Coupe ajustée, visière incurvée."},
      {id:9, name:"Lavande NY", price:199, img:"assets/images/Lavande.png", desc:"Casquette 47 New York Yankees, couleur lavande avec logo NY blanc brodé. Coupe ajustée, visière incurvée."},
      {id:10, name:"Noir NY (Logo Rouge)", price:199, img:"assets/images/Noir Logo Rouge.png", desc:"Casquette 47 New York Yankees, couleur noir avec logo NY rouge brodé. Coupe ajustée, visière incurvée."},
      {id:11, name:"Bleu Roi NY", price:199, img:"assets/images/Bleu Roi.png", desc:"Casquette 47 New York Yankees, couleur bleu roi avec logo NY blanc brodé. Coupe ajustée, visière incurvée."},
      {id:12, name:"Vert Foncé NY Script", price:199, img:"assets/images/Vert Foncé.png", desc:"Casquette 47 New York Yankees, couleur vert foncé avec écriture \"Yankees\" dorée brodée. Coupe ajustée, visière incurvée."},
      {id:13, name:"Crème LA", price:199, img:"assets/images/CrémeLA.png", desc:"Casquette New Era LA (Los Angeles), couleur crème et vert foncé avec logo LA bleu et broderie rose. Coupe ajustée, visière incurvée."},
      {id:14, name:"Rouge NY", price:199, img:"assets/images/Rouge.png", desc:"Casquette 47 New York Yankees, couleur rouge avec logo NY blanc brodé. Coupe ajustée, visière incurvée."},
      {id:15, name:"Vert Foncé NY (Logo Blanc)", price:199, img:"assets/images/Vert Logo blanc.png", desc:"Casquette 47 New York Yankees, couleur vert foncé avec logo NY blanc brodé. Coupe ajustée, visière incurvée."},
      {id:16, name:"Noir NY (Logo Blanc)", price:199, img:"assets/images/Noir logo Blanc.png", desc:"Casquette 47 New York Yankees, couleur noir avec logo NY blanc brodé. Coupe ajustée, visière incurvée."},
      {id:17, name:"Jaune Stone Island", price:199, img:"assets/images/Jaune Stone Island.png", desc:"Casquette 47 Stone Island, couleur jaune avec écusson compass brodé noir. Coupe ajustée, visière incurvée."},
    ];

    const logEl = document.getElementById('log');
    const btn = document.getElementById('startBtn');

    function log(msg, type='info') {
      logEl.innerHTML += `<div class="${type}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    btn.addEventListener('click', async () => {
      let configStr = document.getElementById('configInput').value.trim();
      if(!configStr) return alert("Veuillez coller la configuration Firebase.");

      let config;
      try {
        // Evaluate the string as an object if it's not strict JSON
        config = (new Function("return " + configStr))();
        if(!config.projectId) throw new Error("projectId manquant");
      } catch(e) {
        return alert("Format de configuration invalide. Assurez-vous que c'est un objet JSON valide.");
      }

      btn.disabled = true;
      log("Initialisation Firebase...", "info");
      
      try {
        firebase.initializeApp(config);
        const db = firebase.firestore();
        const storage = firebase.storage();

        // 1. Upload des promotions
        log("Création du document de promotions...", "info");
        await db.collection("settings").doc("promotions").set({
          text_bandeau: "2 CASQUETTES ACHETÉES = -50 DH · 3 ACHETÉES, LA 4ÈME OFFERTE · 199 DH L'UNITÉ · LIVRAISON PARTOUT AU MAROC",
          promo_2: -50,
          promo_3_free: true
        });
        log("Promotions configurées.", "success");

        // 2. Upload des images et création des produits
        for(let p of products) {
          log(`Traitement de ${p.name}...`, "info");
          
          try {
            // Fetch local image
            const response = await fetch(p.img);
            if(!response.ok) throw new Error("Image introuvable localement");
            const blob = await response.blob();
            
            // Upload to Storage
            const filename = p.img.split('/').pop();
            const storageRef = storage.ref(`products/${filename}`);
            await storageRef.put(blob);
            const downloadUrl = await storageRef.getDownloadURL();
            log(`- Image uploadée : ${downloadUrl}`, "success");

            // Save to Firestore
            await db.collection("products").doc(p.id.toString()).set({
              id: p.id,
              name: p.name,
              price: p.price,
              img: downloadUrl,
              desc: p.desc,
              sold_out: false,
              created_at: firebase.firestore.FieldValue.serverTimestamp()
            });
            log(`- Produit ${p.name} enregistré dans Firestore.`, "success");

          } catch (err) {
            log(`Erreur sur ${p.name} : ${err.message}`, "error");
          }
        }

        log("🎉 MIGRATION TERMINÉE AVEC SUCCÈS !", "success");
        log("Tu peux maintenant donner ta config Firebase à ton assistant IA pour qu'il mette à jour le site.", "info");

      } catch (error) {
        log(`Erreur fatale : ${error.message}`, "error");
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
